name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: debug headBlobFor
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const { mkdtempSync, writeFileSync, realpathSync } = require("node:fs");
            const { tmpdir } = require("node:os");
            const { join, relative, resolve } = require("node:path");
            const d = mkdtempSync(join(tmpdir(), "swc-dbg-"));
            execFileSync("git", ["init", "-q"], { cwd: d });
            execFileSync("git", ["config", "user.email", "t@example.com"], { cwd: d });
            execFileSync("git", ["config", "user.name", "t"], { cwd: d });
            execFileSync("git", ["config", "commit.gpgsign", "false"], { cwd: d });
            const p = join(d, "a.py");
            writeFileSync(p, "x = 1\n# why this bucket is shared\ny = 2\n");
            execFileSync("git", ["add", "-A"], { cwd: d });
            execFileSync("git", ["commit", "-q", "-m", "init"], { cwd: d });
            writeFileSync(p, "x = 1\ny = 2\n");
            const root = execFileSync("git", ["rev-parse", "--show-toplevel"], { cwd: d, encoding: "utf8" }).trim();
            console.error("d          =", JSON.stringify(d));
            console.error("realpath d =", JSON.stringify(realpathSync(d)));
            console.error("root       =", JSON.stringify(root));
            console.error("realpath root =", JSON.stringify(realpathSync(root)));
            console.error("resolve(p) =", JSON.stringify(resolve(p)));
            console.error("realpath p =", JSON.stringify(realpathSync(p)));
            const rel = relative(realpathSync(root), realpathSync(resolve(p))).replace(/\\/g, "/");
            console.error("rel        =", JSON.stringify(rel));
            try {
              const blob = execFileSync("git", ["show", `HEAD:${rel}`], { cwd: realpathSync(root), encoding: "utf8" });
              console.error("blob       =", JSON.stringify(blob));
            } catch (e) {
              console.error("git show FAILED:", e.message);
            }
          '
      - run: node --test tests/*.test.mjs
        shell: bash

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate plugin manifests
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json"));
            for (const p of m.plugins) {
              const root = p.source;
              const plugin = JSON.parse(fs.readFileSync(root + "/.claude-plugin/plugin.json"));
              if (plugin.name !== p.name) throw new Error("plugin name mismatch: " + p.name);
              const hooks = JSON.parse(fs.readFileSync(root + "/hooks/hooks.json"));
              for (const entries of Object.values(hooks.hooks)) for (const e of entries) for (const h of e.hooks) {
                const rel = h.command.match(/\$\{CLAUDE_PLUGIN_ROOT\}\/([^" ]+)/)[1];
                if (!fs.existsSync(root + "/" + rel)) throw new Error("hook script missing: " + rel);
              }
              if (!fs.existsSync(root + "/README.md")) throw new Error("README missing");
            }
            console.log("manifests ok");
          '
